syntax = "proto3";
package federated;

service Coordinator {
    rpc RegisterClient(ClientInfo) returns (RegistrationResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc GetTrainingTask(ClientId) returns (TrainingTask);
    rpc ReportResults(TrainingResults) returns (Acknowledgement);
}

message ClientInfo {
    string client_id = 1;
    string ip_address = 2;
    int32 data_samples = 3;
    float compute_power = 4;
}

message RegistrationResponse {
  bool success = 1;
  string message = 2;
  int32 assigned_port = 3;
}

message HeartbeatRequest {
  string client_id = 1;
  float current_loss = 2;
  int32 epoch = 3;
}

message HeartbeatResponse {
  bool should_continue = 1;
  int32 current_round = 2;
}

message ClientId {
  string id = 1;
}

message TrainingTask {
  int32 round_number = 1;
  int32 local_epochs = 2;
  float learning_rate = 3;
  bool should_train = 4;
}

message TrainingResults {
  string client_id = 1;
  int32 round_number = 2;
  float final_loss = 3;
  float accuracy = 4;
}

message Acknowledgment {
  bool success = 1;
}